server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Everything is same-origin (this server also proxies /api), so the policy can be strict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;  # set, never append: a client-sent value must not survive
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        proxy_read_timeout 60s;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri /index.html; }
}
