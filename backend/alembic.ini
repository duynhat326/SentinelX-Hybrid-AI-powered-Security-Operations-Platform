[alembic]
script_location = alembic
prepend_sys_path = .
# URL comes from SENTINELX_DATABASE_URL (see alembic/env.py); this is only a fallback.
sqlalchemy.url = sqlite+pysqlite:///./sentinelx.db

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
