services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
    environment:
      SENTINELX_API_KEY: ${SENTINELX_API_KEY:?set SENTINELX_API_KEY in .env}
      SENTINELX_DATABASE_URL: postgresql+psycopg://sentinelx:${POSTGRES_PASSWORD}@db:5432/sentinelx
      SENTINELX_LLM_PROVIDER: ${SENTINELX_LLM_PROVIDER:-none}  # none = AI investigation off (default)
      # Threat intelligence: lookups send an indicator to a third party, so they are off by default and still need a per-request confirmation
      SENTINELX_TI_EXTERNAL_ENABLED: ${SENTINELX_TI_EXTERNAL_ENABLED:-false}
      SENTINELX_VT_API_KEY: ${SENTINELX_VT_API_KEY:-}
      SENTINELX_ABUSEIPDB_API_KEY: ${SENTINELX_ABUSEIPDB_API_KEY:-}
      # Response: approval only simulates unless real actions are enabled; protected addresses/networks (comma separated) can never be targeted
      SENTINELX_RESPONSE_REAL_ACTIONS_ENABLED: ${SENTINELX_RESPONSE_REAL_ACTIONS_ENABLED:-false}
      SENTINELX_PROTECTED_IPS: ${SENTINELX_PROTECTED_IPS:-}
    ports: ["127.0.0.1:8000:8000"]
volumes:
  pgdata:
